<style>

.btn{border:1px solid #ffffff24;background:#284b46;padding:9px 14px;min-height:42px;border-radius:10px;font-weight:800;line-height:1.16}.btn:hover{filter:brightness(1.12)}.primary{background:var(--gold);color:#2b2a1c;border-color:#ffdb93;box-shadow:0 3px #966036}.mint{background:var(--mint);color:#173831;border-color:#daeec9}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.console .actions{margin:0;justify-content:flex-end;flex-shrink:0}.foot{display:flex;justify-content:space-between;gap:8px;margin-top:8px;color:var(--muted);font-size:.8rem}
.overlay{position:fixed;inset:0;z-index:3;background:#081d1de0;display:grid;justify-items:center;align-items:center;padding:8px;overflow:auto;overscroll-behavior:contain}.overlay[hidden]{display:none}.sheet{width:min(100%,520px);background:#173936;border:1px solid #648376;border-radius:19px;box-shadow:0 15px 65px #0008;padding:clamp(12px,3vw,21px);max-height:100%;overflow:auto;scrollbar-width:thin}.sheet p{margin-top:6px}.sheet .eyebrow{margin-bottom:4px}.sheet header{margin-bottom:7px}.options{display:grid;gap:7px;margin-top:10px}.option{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#214641;border:1px solid var(--line);border-radius:10px;padding:7px 9px}.option small{display:block;color:var(--muted)}.option b{color:var(--gold)}
.cleanout{width:min(100%,475px)}.puzzle-head{display:flex;align-items:center;justify-content:space-between;gap:6px}.moves{text-align:center;background:#274e46;padding:5px 9px;border-radius:9px;white-space:nowrap;font-weight:900;color:var(--mint);font-size:.85rem}.moves.warn{background:#732e29;color:#ffe6dd;animation:pulse 1.3s infinite}@keyframes pulse{50%{box-shadow:0 0 0 4px #ff826857}}
.locker{position:relative;isolation:isolate;margin:8px auto 0;width:min(100%,390px, calc(100dvh - 245px));min-width:min(100%,245px);padding:7px;border:3px solid #b1804e;border-radius:10px;background:#3b392c;box-shadow:inset 0 0 0 2px #1f231c,0 4px #0c2423;overflow:hidden}.locker::before{position:absolute;inset:0;content:"";z-index:-1;background:repeating-linear-gradient(0deg,#fbd49416 0 3px,transparent 3px 15px),linear-gradient(110deg,#86643c,#232a26 55%,#684f36);opacity:calc(.22 + var(--clutter,0)*.78)}.locker::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(#a5895f 0 8px,#67543a 8px 10px);animation:door .49s ease forwards;transform-origin:top;z-index:2}@keyframes door{to{transform:scaleY(0)}}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;touch-action:none}.tile{display:grid;place-items:center;position:relative;aspect-ratio:1;min-width:0;padding:0;border:1px solid #ffffff41;border-radius:7px;background:var(--tile);box-shadow:inset 0 -3px #0003;font-size:clamp(17px,5.25vw,27px);line-height:1;user-select:none;-webkit-user-select:none}.tile.empty{background:#10181546;box-shadow:none;border-color:#c7ba921d;pointer-events:none}.tile.tarp{background:repeating-linear-gradient(135deg,#68766a 0 5px,#56665d 5px 10px);color:white}.tile.tarp small{position:absolute;right:3px;bottom:2px;font-size:9px;text-shadow:0 1px #000}.tile.tarp span{opacity:.38}.tile.selected,.tile.hint{outline:2px solid #fff7ab;outline-offset:-2px;z-index:1}.tile.hint{animation:pulse 1s infinite}.tile.bump{animation:bump .24s}.tile.pop{animation:pop .28s forwards}@keyframes bump{30%{transform:translateX(4px)}70%{transform:translateX(-4px)}}@keyframes pop{50%{transform:scale(1.25);filter:brightness(1.6)}100%{transform:scale(.35);opacity:0}}
.gridnote{min-height:2.7em;font-size:.88rem;color:var(--mint)}.cleanout .actions{margin-top:6px;justify-content:space-between}.cases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}.case{min-height:67px;padding:4px;font-size:.72rem;background:#694e36;border-color:#a7814d}.case span{display:block;font-size:1.25rem}.case.face{background:#406b5c;color:#fff;opacity:1}.case.matched{background:#255246;color:#c5ecd2;opacity:1}.case:disabled:not(.face):not(.matched){opacity:.7}.summary{color:var(--gold);font-size:1.15rem;font-weight:800}.roll-face{display:inline-block;min-width:1.3em;text-align:center}
@media(min-width:760px){.yard canvas{aspect-ratio:800/408}.shell{padding-top:19px}.yard-tag{top:13px;left:14px}.hud{gap:10px}}@media(max-width:440px){.console{flex-wrap:wrap}.console .actions{justify-content:flex-start}.stat{padding-inline:8px}.sheet .actions .btn{padding-inline:10px}.foot{font-size:.72rem}}@media(max-height:690px){.cleanout{padding:10px}.cleanout .gridnote{font-size:.8rem}.cleanout .actions .btn{min-height:38px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important}}
.tile.hint{outline:3px solid #ffda75;outline-offset:-3px;animation:none}
.tile.hint-match{box-shadow:inset 0 0 0 2px #aaf0c9}
.tile.hint::after{content:attr(data-step);position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:50%;background:#ffda75;color:#202d24;font:900 11px/16px system-ui;text-align:center}
.tile.hint.selected{outline-color:white}
.tile.dragging{z-index:2;pointer-events:none}
.tile.neighbor-slide{z-index:1;pointer-events:none}

.gridnote{min-height:2.7em}

<body>
<main class="shell" id="main">
<header><div class="brand"><div class="brandmark" aria-hidden="true">⚓</div><div><div class="label">Sunnyvale / First Fortune</div><h1>Storage Auction Rush</h1></div></div><button class="sound" id="sound" aria-label="Toggle sound" aria-pressed="false">🔈</button></header>
<div class="hud" aria-label="Your haul"><div class="stat"><div class="label">Cash</div><strong id="cash"></strong></div><div class="stat"><div class="label">Earned rolls</div><strong id="rolls"></strong></div><div class="stat"><div class="label">Truck load</div><strong id="load"></strong></div></div>
<div class="yard"><canvas id="yard" width="800" height="500" role="img" aria-label="Isometric Sunnyvale auction yard and sixteen-space board"></canvas><div class="yard-tag" id="yardTag"></div></div>
<section class="console"><div><div class="label" id="where"></div><h2 id="boardTitle"></h2><p id="boardNote" class="muted"></p></div><div class="actions" id="boardActions"></div></section>
<div class="foot"><span>Board Adventure</span><span id="saveInfo">Saved in this browser</span></div>
</main>
<div class="overlay" id="overlay" hidden><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"></section></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const key = 'storage-auction-rush-board-v1';
const spaces = ['Payday','Auction','Day Off','Pawn','Case Match','Auction','Flea','Upgrade','Big Earl','Day Off','Auction','Pawn','Case Match','Flea','Upgrade','Auction'];
const spaceIcons = {'Payday':'$','Auction':'▥','Day Off':'☕','Pawn':'◆','Case Match':'▣','Flea':'⚑','Upgrade':'↑','Big Earl':'★'};
const sets = [
 ['tools','🔧','Tool Chest'],['radios','📻','Tube Radio'],['music','🎸','Travel Guitar'],['jewelry','💍','Silver Ring'],
 ['garage','⚙️','Chrome Horn'],['games','🕹️','Arcade Stick'],['designer','👜','Leather Satchel'],['history','🏺','Old Stoneware'],
 ['kitchen','🫖','Enamel Teapot'],['toys','🤖','Tin Robot'],['reading','📚','Adventure Annuals'],['sports','⚾','Signed Baseball'],['shelf','🪴','Ceramic Planter']
];
const tiles = [['📦','Crate','#bc784a'],['🛞','Tire','#596787'],['📼','Tape','#a0668a'],['🧰','Toolbox','#b65b4d'],['🏺','Pot','#498579'],['🪑','Chair','#9b8546']];
const shuffle = values => {
 const result = [...values];
 for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]];}
 return result;
};
const format = new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const money = amount => '$'+format.format(amount);
function fresh(){
 return {cash:10, rolls:0, truck:[], truckLevel:0, flea:0, level:1, lap:0, position:0, clears:0, rest:0, star:0, serial:0, intro:true, checkpoint:false, taughtShove:false, taughtHaul:false, sound:true, note:'Ten bucks and a rusty pickup. That first door is yours for a dollar.', event:null, locker:null};
}
let state = fresh();
try{const saved=localStorage.getItem(key);if(saved) state=JSON.parse(saved);}catch{}
let saveOK=true;
function save(){
 try{localStorage.setItem(key,JSON.stringify(state));saveOK=true;}catch{saveOK=false;}
 $('saveInfo').textContent=saveOK?'Saved in this browser':'Browser storage unavailable';
}
const curve = () => Math.round(10 ** (Math.min(state.level-1,59)/20 + Math.max(0,state.level-60)/32));
const capacity = () => 6+4*state.truckLevel;
const addRoll = () => {if(state.rolls>=5)return false;state.rolls++;return true;};
const sealedBid = () => 3*curve();
const round = value => Math.max(1,Math.round(value));
function newFind(kind=Math.floor(Math.random()*sets.length), value=round(curve()*(6+Math.random()*12))){
 const [set,icon,name]=sets[kind];
 return {id:++state.serial,set,icon,name,value};
}
function loadFind(find){
 if(state.truck.length<capacity()){
  state.truck.push(find);
  return find.name+' loaded.';
 }
 const sale=round(find.value*.4);
 state.cash+=sale;
 return find.name+' · truck full: sold at curb price +'+money(sale);
}
function takeItem(id){return state.truck.splice(state.truck.findIndex(item=>item.id===id),1)[0];}

let audio;
function sound(kind){
 if(!state.sound)return;
 try{
  const Audio=window.AudioContext||window.webkitAudioContext;
  audio ||= new Audio();
  if(audio.state==='suspended')audio.resume().catch(()=>{});
  const patterns={door:[83,68,105],pop:[370,535,720],chain:[620,350,540,245],win:[392,494,587,784],hop:[225],bad:[110,80]};
  patterns[kind].forEach((hz,i)=>{
   const oscillator=audio.createOscillator(), gain=audio.createGain(), time=audio.currentTime+i*.063;
   oscillator.type=kind==='chain'?'triangle':'sine';
   oscillator.frequency.setValueAtTime(hz,time);
   oscillator.frequency.exponentialRampToValueAtTime(hz*.76,time+.09);
   gain.gain.setValueAtTime(.0001,time);
   gain.gain.exponentialRampToValueAtTime(.075,time+.012);
   gain.gain.exponentialRampToValueAtTime(.0001,time+.12);
   oscillator.connect(gain);gain.connect(audio.destination);
   oscillator.start(time);oscillator.stop(time+.13);
  });
 }catch{}
}

function tarp(cell){return cell!==null&&typeof cell==='object';}
function item(cell){return typeof cell==='number';}
function matches(grid){
 const hits=new Set();
 for(let r=0;r<7;r++)for(let c=0;c<7;c++){
  const i=r*7+c, value=grid[i];
  if(!item(value))continue;
  if(c<=4&&grid[i+1]===value&&grid[i+2]===value){hits.add(i);hits.add(i+1);hits.add(i+2);}
  if(r<=4&&grid[i+7]===value&&grid[i+14]===value){hits.add(i);hits.add(i+7);hits.add(i+14);}
 }
 return hits;
}
function neighbors(i){
 return [i%7?i-1:-1,i%7<6?i+1:-1,i>=7?i-7:-1,i<42?i+7:-1].filter(j=>j>=0);
}
function exchange(grid,a,b){[grid[a],grid[b]]=[grid[b],grid[a]];}
function legal(grid){
 for(let a=0;a<49;a++){
  if(!item(grid[a]))continue;
  for(const b of neighbors(a)){
   if(b<=a||!item(grid[b])||grid[a]===grid[b])continue;
   exchange(grid,a,b);
   const hits=matches(grid);
   exchange(grid,a,b);
   if(hits.has(a)||hits.has(b))return [a,b];
  }
 }
 return null;
}
function gravity(grid){
 for(let c=0;c<7;c++){
  let write=6;
  for(let r=6;r>=0;r--){
   const i=r*7+c;
   if(tarp(grid[i])){write=r-1;continue;}
   if(!item(grid[i]))continue;
   const value=grid[i];
   grid[i]=null;
   grid[write*7+c]=value;
   write--;
  }
 }
}
function packed(values,tarps){
 // Keep tarp identities and distribute the junk among seven falling columns.
 for(let attempt=0;attempt<180;attempt++){
  const grid=Array(49).fill(null);
  const positions=shuffle(Array.from({length:28},(_,i)=>i+7)).slice(0,tarps.length);
  tarps.forEach((cell,i)=>{grid[positions[i]]=cell;});
  const slots=Array.from({length:7},(_,c)=>Array.from({length:7},(_,r)=>(6-r)*7+c).filter(i=>!tarp(grid[i])));
  for(const value of shuffle(values)){
   const columns=slots.filter(col=>col.length);
   const col=columns[Math.floor(Math.random()*columns.length)];
   grid[col.shift()]=value;
  }
  const occupied=grid.flatMap((cell,i)=>item(cell)?[i]:[]);
  let hits=matches(grid);
  // Repair random runs without changing the exact inventory or tarp positions.
  for(let repair=0;hits.size&&repair<90;repair++){
   const marked=[...hits];
   const a=marked[Math.floor(Math.random()*marked.length)];
   const b=occupied[Math.floor(Math.random()*occupied.length)];
   if(grid[a]===grid[b])continue;
   exchange(grid,a,b);
   const result=matches(grid);
   if(result.size<hits.size||(result.size===hits.size&&Math.random()<.25))hits=result;
   else exchange(grid,a,b);
  }
  if(!hits.size&&legal(grid))return grid;
 }
 return null;
}
function lockerSpecs(kind){
 if(kind==='first'||kind==='curb')return {tier:'Starter',types:5,base:14};
 const normal=state.level>=2;
 const elevated=kind==='estate'||kind==='rival';
 if(state.level>=5||(normal&&elevated))return {tier:'Tough',types:5,base:13};
 if(normal||elevated)return {tier:'Normal',types:6,base:14};
 return {tier:'Starter',types:5,base:14};
}
const lockerNames={first:'The $1 Locker',curb:'Curb Pile',garage:'Dusty Garage',estate:'Sealed Estate',rival:'Big Earl’s Locker'};
function makeLayout(locker){
 const clutter=[];
 for(let set=0;set<15;set++){
  const type=set%locker.types;
  clutter.push(type,type,type);
 }
 const tarps=Array.from({length:locker.tarps},(_,i)=>({
  layers:i===0?1:1+Math.floor(Math.random()*2),
  find:locker.prizes[i]||null
 }));
 let grid;
 while(!grid)grid=packed(clutter,tarps);
 return grid;
}
function openLocker(kind,bid){
 if(state.cash<bid||state.locker)return;
 const spec=lockerSpecs(kind), bonus=Math.min(3,state.rest+state.star), budget=spec.base+bonus+state.truckLevel;
 const prize=kind==='first'?newFind(9,12):newFind();
 const extra=kind==='estate'||kind==='rival'||(kind==='garage'&&Math.random()<.35);
 const locker={...spec,kind,bid,budget,bonus,truckBonus:state.truckLevel,moves:budget,rate:curve(),
  tarps:kind==='curb'?2:kind==='first'?3:4,prizes:[prize,extra?newFind():null],finds:[],cleared:0,
  note:'Swap neighboring items to line up three. Tap twice or swipe.',lesson:''};
 locker.grid=makeLayout(locker);
 locker.initial=locker.grid.filter(cell=>cell!==null).length;
 state.cash-=bid;
 state.rest=0;state.star=0;
 state.event=null;
 state.locker=locker;
 selected=null; hints=[];
 sound('door');
 commit();
}
function collect(locker,cell){
 if(!cell.find)return;
 locker.finds.push({find:cell.find,message:loadFind(cell.find)});
}
function resolveMatches(locker,hits){
 while(hits.size){
  const chipped=new Set();
  for(const i of hits){
   for(const j of neighbors(i))if(tarp(locker.grid[j]))chipped.add(j);
   locker.grid[i]=null;
   locker.cleared++;
  }
  for(const i of chipped){
   const cell=locker.grid[i];
   if(--cell.layers===0){
    collect(locker,cell);
    locker.grid[i]=null;
   }
  }
  gravity(locker.grid);
  hits=matches(locker.grid);
 }
}
function settle(locker){
 const notes=[];
 while(locker.grid.some(cell=>cell!==null)){
  const values=locker.grid.filter(item);
  const counts=Array(locker.types).fill(0);
  for(const value of values)counts[value]++;
  const triple=counts.findIndex(count=>count>=3);
  if(triple<0){
   if(!state.taughtHaul){notes.push('Crew haul-out: no triples left. They pull the tarps and save any finds.');state.taughtHaul=true;}
   else notes.push('Crew hauled out the leftovers.');
   for(const cell of locker.grid)if(tarp(cell))collect(locker,cell);
   locker.cleared+=values.length;
   locker.grid.fill(null);
   break;
  }
  if(locker.moves===0||legal(locker.grid))break;
  if(!state.taughtShove){notes.push('Free shove: the crew repacks the junk when there’s no legal swap.');state.taughtShove=true;}
  else if(!notes.includes('Free shove!'))notes.push('Free shove!');
  const repacked=packed(values,locker.grid.filter(tarp));
  if(repacked){locker.grid=repacked;break;}
  // A stack with no exchangeable pattern can still be lined up by the crew.
  const aligned=[42,43,44];
  notes.push('The crew lined up a triple.');
  for(const i of aligned){
   if(locker.grid[i]===triple)continue;
   const j=locker.grid.findIndex((cell,index)=>cell===triple&&!aligned.includes(index));
   exchange(locker.grid,i,j);
  }
  resolveMatches(locker,matches(locker.grid));
 }
 return notes;
}
function finishLocker(won){
 const locker=state.locker;
 const haul=round(.03*locker.cleared*locker.rate*(won?1:.5));
 state.cash+=haul;
 const roll=won&&addRoll();
 if(won){
  state.clears++;
  if(locker.kind!=='curb')state.level++;
 }
 if(locker.kind==='first')state.intro=false;
 state.event={type:'summary',won,haul,roll,finds:locker.finds.map(entry=>entry.message),note:locker.lesson};
 state.locker=null;
 selected=null;hints=[];
 if(won)sound('win');
}
function retry(){
 const locker=state.locker;
 locker.grid=makeLayout(locker);
 // A retry keeps finds already loaded or sold and removes their prize markers.
 locker.moves=locker.budget;locker.cleared=0;locker.lesson='';
 locker.note='Fresh stack. Your bid is already paid.';
 selected=null;hints=[];
 sound('door');commit();
}
let selected=null,hints=[],busy=false,rolling=false,hop=null,die=null;
function previewSwap(grid,a,b){
 exchange(grid,a,b);
 const hits=matches(grid);
 const kinds=[...new Set([...hits].map(i=>grid[i]))];
 exchange(grid,a,b);
 return {hits,kinds};
}
function suggestMove(locker){
 hints=legal(locker.grid)||[];
 selected=null;
}
function hintText(grid){
 const [a,b]=hints;
 const {kinds}=previewSwap(grid,a,b);
 const icons=kinds.map(kind=>tiles[kind][0]).join(' ');
 return 'Drag 1 toward 2, or tap both, to line up '+icons+'. Mint outlines mark matching tiles already in place.';
}
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function readySwap(a,b){
 const locker=state.locker;
 if(!locker||busy||locker.moves<=0||!neighbors(a).includes(b)||!item(locker.grid[a])||!item(locker.grid[b]))return false;
 exchange(locker.grid,a,b);
 const hits=matches(locker.grid);
 const swapped=[locker.grid[a],locker.grid[b]];
 if(!hits.size){
  exchange(locker.grid,a,b);locker.note='That swap needs three identical items straight across or down. No move spent.';sound('bad');

const wide=matchMedia('(min-width: 760px)');
let paintSignature='';
function drawYard(now){
 requestAnimationFrame(drawYard);
 const signature=[state.position,state.flea,state.truckLevel,wide.matches,devicePixelRatio].join('|');
 if(!hop&&signature===paintSignature)return;
 paintSignature=signature;
 const density=Math.min(2,devicePixelRatio||1), tall=wide.matches?408:500;
 if(canvas.width!==800*density||canvas.height!==tall*density){canvas.width=800*density;canvas.height=tall*density;}
 ctx.setTransform(density,0,0,density*tall/500,0,0);
 const sky=ctx.createLinearGradient(0,0,0,500);sky.addColorStop(0,'#b2d6b7');sky.addColorStop(1,'#e8d6a7');
 box(0,0,800,500,sky);
 ellipse(692,52,32,32,'#ffde8d');
 shape([[0,115],[94,49],[159,99],[217,74],[306,124],[378,101],[450,129],[562,72],[664,131],[736,92],[800,130],[800,250],[0,250]],'#92ad83');
 shape([[0,153],[129,107],[243,143],[364,119],[509,151],[640,120],[800,147],[800,245],[0,245]],'#a8b48a');
 shape([[0,240],[410,105],[800,175],[800,500],[0,500]],'#c7b47f');
 shape([[0,265],[403,129],[800,198],[800,500],[0,500]],'#d9c391');
 const trail=[[431,245],[504,246],[548,272],[506,293],[113,291],[61,321],[47,369],[111,420]];
 line(trail,'#8f9461',22);line(trail,'#eddbad',14);
 line(points,'#958c58',38);line(points,'#ebd8a7',29);
 for(let n=0;n<75;n++){
  const x=(n*137+23)%800,y=210+(n*61+11)%280;
  ellipse(x,y,n%3+1,1,n%2?'#ac99706b':'#fcdfab99');
 }
 [[34,227,1.1],[252,189,.9],[304,174,.7],[583,182,.9],[761,205,1.13],[772,336,.8],[31,388,.8],[714,442,.72]].forEach(args=>tree(...args));
 garageBuilding();pawnBuilding();fleaBuilding();pickup(521,206);
 banner('SUNNYVALE',252,214,102,'#407060');
 for(const i of [...Array(16).keys()].sort((a,b)=>points[a][1]-points[b][1])){
  const [x,y]=points[i], space=spaces[i], selectedSpace=i===state.position&&!hop;
  const tile=[[x-44,y-19],[x+37,y-19],[x+45,y+13],[x-36,y+13]];
  shape(tile.map(([tx,ty])=>[tx,ty+9]),'#86764c');
  shape(tile,selectedSpace?'#ffe296':boardColors[space],selectedSpace?'#fff3b8':'#6c7856');
  label(spaceIcons[space],x-25,y-3,18);
  const boardLabel=space==='Case Match'?'Cases':space==='Big Earl'?'Earl':space;
  label(boardLabel,x+8,y-3,12);
 }
 let [x,y]=points[state.position],lift=0;
 if(hop){
  const progress=Math.min(hop.steps,(now-hop.start)/hop.duration);
  const step=Math.floor(progress), fraction=progress-step;
  const index=(hop.from+step)%16,next=(index+1)%16;
  const from=points[index],to=points[next];
  if(index===15){
   const section=Math.min(trail.length-2,Math.floor(fraction*(trail.length-1)));
   const part=fraction*(trail.length-1)-section;
   const [a,b]=trail.slice(section,section+2);
   x=a[0]+(b[0]-a[0])*part;y=a[1]+(b[1]-a[1])*part;
  }else{
   x=from[0]+(to[0]-from[0])*fraction;y=from[1]+(to[1]-from[1])*fraction;
  }
  lift=Math.sin(fraction*Math.PI)*34;
  if(progress<hop.steps)paintSignature='';
 }
 pirate(x,y-16,lift);
}
wide.addEventListener('change',()=>{paintSignature='';});
if(state.locker?.grid.every(cell=>cell===null))finishLocker(true);
commit();
scheduleCase();
requestAnimationFrame(drawYard);
</script>
